<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amigos do Rui</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --papel: #e8d9b0;
        --tinta: #14100c;
        --brasa: #ffa64d;
        --fumaca: rgba(10, 8, 6, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: var(--papel);
        font-family: Georgia, 'Times New Roman', serif;
      }
      canvas#jogo {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: fixed;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
      }
      #noite {
        top: 18px;
        left: 20px;
        font-size: 14px;
        line-height: 1.5;
        max-width: 260px;
      }
      #noite h2 {
        margin: 0 0 4px;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brasa);
        font-weight: normal;
      }
      #noite ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #noite li::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--brasa);
        box-shadow: 0 0 6px var(--brasa);
        vertical-align: middle;
      }
      #mira {
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px;
        border-radius: 50%;
        background: rgba(232, 217, 176, 0.75);
      }
      #lugar {
        bottom: 15%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #lugar small {
        display: block;
        margin-top: 4px;
        font-size: 14px;
        font-style: italic;
        opacity: 0.85;
      }
      #lugar.fechado {
        color: #a59c8d;
      }
      #teclas {
        bottom: 16px;
        left: 20px;
        font-size: 12px;
        opacity: 0.65;
        letter-spacing: 0.03em;
      }
      #mapa {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 86vh;
        aspect-ratio: 122 / 176;
        display: none;
        border: 1px solid #5a4a36;
        box-shadow: 0 10px 60px #000;
      }
      #mapa svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #entrada {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at center, rgba(10, 8, 6, 0.55), rgba(3, 3, 5, 0.92));
        cursor: pointer;
        text-align: center;
      }
      #entrada h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 68px);
        letter-spacing: 0.08em;
        font-weight: normal;
      }
      #entrada p {
        margin: 14px 0 0;
        font-size: 16px;
        opacity: 0.85;
      }
      #entrada .entrar {
        margin-top: 34px;
        color: var(--brasa);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 14px;
      }
      #entrada dl {
        margin: 30px auto 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 6px 18px;
        width: fit-content;
        font-size: 14px;
        text-align: left;
        opacity: 0.8;
      }
      #entrada dt {
        color: var(--brasa);
        text-align: right;
      }
      #entrada dd {
        margin: 0;
      }
      .sem-hud .hud,
      .sem-hud #entrada {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="jogo"></canvas>
    <div class="hud" id="noite"></div>
    <div class="hud" id="mira"></div>
    <div class="hud" id="lugar"></div>
    <div class="hud" id="teclas">WASD anda · Shift corre · F lampião · M mapa · R outra noite · Esc solta o mouse</div>
    <div id="mapa"></div>
    <div id="entrada">
      <div>
        <h1>Amigos do Rui</h1>
        <p>A diligência quebrou. Faltam oito horas para amanhecer.</p>
        <dl>
          <dt>WASD</dt>
          <dd>andar</dd>
          <dt>Mouse</dt>
          <dd>olhar</dd>
          <dt>Shift</dt>
          <dd>correr</dd>
          <dt>F</dt>
          <dd>acender ou apagar o lampião</dd>
          <dt>M</dt>
          <dd>abrir o mapa</dd>
          <dt>R</dt>
          <dd>sortear outra noite</dd>
        </dl>
        <div class="entrar">Clique para entrar na cidade</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
