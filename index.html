<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amigos do Rui: a caçada</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --papel: #e8d9b0;
        --tinta: #14100c;
        --brasa: #ffa64d;
        --fumaca: rgba(10, 8, 6, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--papel);
        font-family: Georgia, 'Times New Roman', serif;
      }
      canvas#jogo {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #rodape {
        position: fixed;
        right: 12px;
        bottom: 8px;
        font-size: 12px;
        opacity: 0.45;
      }
      #rodape a {
        color: var(--papel);
      }
      #rodape a:hover {
        color: var(--brasa);
      }
    </style>
  </head>
  <body>
    <canvas id="jogo"></canvas>
    <div id="hud"></div>
    <div id="rodape"><a href="carta.html">noite da carta (modo antigo)</a></div>
    <script type="module" src="/src/caca/main.ts"></script>
  </body>
</html>
